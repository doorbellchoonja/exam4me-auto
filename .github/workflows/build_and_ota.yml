name: Build ExamAuto IPA & Deploy OTA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 직접 업로드된 인증서 파일 설치
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "actions_pass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "actions_pass" $KEYCHAIN_PATH

          # 1. p12에서 인증서와 개인키 추출 및 키체인 등록
          openssl pkcs12 -in Certificates/cert.p12 -clcerts -nokeys -passin pass:"1" -out $RUNNER_TEMP/cert.cer
          openssl pkcs12 -in Certificates/cert.p12 -nocerts -nodes -passin pass:"1" -out $RUNNER_TEMP/key.pem

          security import $RUNNER_TEMP/cert.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security import $RUNNER_TEMP/key.pem -k $KEYCHAIN_PATH -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple: -s -k "actions_pass" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          rm -f $RUNNER_TEMP/cert.cer $RUNNER_TEMP/key.pem

          # 2. 모바일 프로비저닝 프로필 설치
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp Certificates/cert.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/b6faffb9-be71-4711-b11a-d5e79b38537a.mobileprovision

      - name: 앱 번들 조립 및 정식 코드서명
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p ExamAuto.app

          # 1. Swift 앱 바이너리 컴파일
          swiftc -parse-as-library -target arm64-apple-ios15.0 -sdk $SDK_PATH \
                 -framework SwiftUI -framework WebKit -framework UIKit \
                 AppSource/App.swift -o ExamAuto.app/ExamAuto

          # 2. 필수 앱 번들 메타데이터 생성
          cp AppSource/Info.plist ExamAuto.app/Info.plist
          echo -n "APPL????" > ExamAuto.app/PkgInfo

          # 3. Swift 표준 런타임 프레임워크 복사 (iOS 설치 검증 필수)
          mkdir -p ExamAuto.app/Frameworks
          SWIFT_LIB_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          if [ -d "$SWIFT_LIB_PATH" ]; then
            cp $SWIFT_LIB_PATH/*.dylib ExamAuto.app/Frameworks/ || true
          fi

          # 4. Entitlements 추출 및 프로비저닝 임베드
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/b6faffb9-be71-4711-b11a-d5e79b38537a.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" profile.plist > entitlements.plist
          cp ~/Library/MobileDevice/Provisioning\ Profiles/b6faffb9-be71-4711-b11a-d5e79b38537a.mobileprovision ExamAuto.app/embedded.mobileprovision

          # 5. 내부 프레임워크 서명 후 메인 앱 서명
          if [ -d "ExamAuto.app/Frameworks" ]; then
            find ExamAuto.app/Frameworks -type f -name "*.dylib" -exec /usr/bin/codesign --force --sign "iPhone Distribution: Jiangsu Simcere Pharmaceutical Co.,Ltd" --timestamp=none {} \;
          fi

          /usr/bin/codesign --force --sign "iPhone Distribution: Jiangsu Simcere Pharmaceutical Co.,Ltd" \
                            --entitlements entitlements.plist \
                            --timestamp=none \
                            ExamAuto.app

          # 6. IPA 패키징
          mkdir -p Payload
          cp -r ExamAuto.app Payload/
          zip -qr ExamAuto.ipa Payload
          rm -rf Payload

      - name: OTA Manifest & 웹페이지 생성
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public
          cp ExamAuto.ipa public/ExamAuto.ipa

          BASE_URL="https://${GH_OWNER}.github.io/${GH_REPO}"

          # 더미 1x1 투명 아이콘 생성 (iOS OTA 규격 준수용)
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 --decode > public/icon57.png
          cp public/icon57.png public/icon512.png

          # iOS 15+ 필수 3개 애셋(IPA, 57px, 512px) 포함 manifest.plist 생성
          cat << EOF > public/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto.ipa</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>display-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon57.png</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>full-size-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon512.png</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.worksin.one</string>
                          <key>bundle-version</key>
                          <string>1.0.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # OTA 다운로드 웹페이지
          cat << EOF > public/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ExamAuto OTA 설치</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f2f2f7; }
                  .card { background: white; padding: 32px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; max-width: 85%; width: 320px; }
                  .btn { display: block; background-color: #007aff; color: white; padding: 15px 0; text-decoration: none; border-radius: 14px; font-size: 17px; font-weight: 600; margin-top: 24px; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2 style="margin:0 0 8px 0; color:#1c1c1e;">ExamAuto</h2>
                  <p style="margin:0; color:#8e8e93; font-size:14px;">Safari에서 아래 버튼을 눌러 설치하세요.</p>
                  <a class="btn" href="itms-services://?action=download-manifest&url=${BASE_URL}/manifest.plist">설치하기</a>
              </div>
          </body>
          </html>
          EOF

      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
