name: Build Signed & Unsigned IPA, Deploy OTA & Web

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Dynamic Version
        id: versioning
        run: |
          BASE_VERSION="1.0"
          BUILD_NUMBER=${{ github.run_number }}
          FULL_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "APP_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Extract Certificate and Key
        run: |
          mkdir -p $RUNNER_TEMP/certs_out
          P12_SRC=$(find . -maxdepth 3 -name "*.p12" | head -n 1)
          PROV_SRC=$(find . -maxdepth 3 -name "*.mobileprovision" | head -n 1)

          if [ -z "$P12_SRC" ] || [ -z "$PROV_SRC" ]; then
            echo "::error::인증서(.p12) 또는 프로비저닝 프로필(.mobileprovision) 파일을 찾을 수 없습니다."
            exit 1
          fi

          mkdir -p certs
          cp "$P12_SRC" certs/cert.p12
          cp "$PROV_SRC" certs/profile.mobileprovision

          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/certs_out/cert.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/certs_out/cert.pem

          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/certs_out/key.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/certs_out/key.pem

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"

          cat $RUNNER_TEMP/certs_out/cert.pem $RUNNER_TEMP/certs_out/key.pem > $RUNNER_TEMP/certs_out/combined.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/certs_out/combined.pem -out $RUNNER_TEMP/certs_out/rebuilt.p12 -passout pass:actions
          
          security import $RUNNER_TEMP/certs_out/rebuilt.p12 -P actions -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Secure iOS Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SWIFT_SRC=$(find . -maxdepth 3 -name "App.swift" -o -name "main.swift" | head -n 1)
          if [ -z "$SWIFT_SRC" ]; then
            SWIFT_SRC=$(find . -maxdepth 3 -name "*.swift" | head -n 1)
          fi

          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI \
                 -framework WebKit \
                 -framework UIKit \
                 -O \
                 -whole-module-optimization \
                 -parse-as-library \
                 "$SWIFT_SRC" \
                 -o ExamAuto

          strip -r -u ExamAuto

      - name: Package Unsigned and Signed IPA
        run: |
          mkdir -p Payload/ExamAuto.app
          cp ExamAuto Payload/ExamAuto.app/ExamAuto
          echo -n "APPL????" > Payload/ExamAuto.app/PkgInfo

          PLIST_SRC=$(find . -maxdepth 3 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST_SRC" ]; then
            cp "$PLIST_SRC" Payload/ExamAuto.app/Info.plist
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ExamAuto" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string ExamAuto" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" Payload/ExamAuto.app/Info.plist 2>/dev/null || true

          ICON_SRC=$(find . -maxdepth 3 -name "*Icon*.png" -o -name "image*.png" | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            sips -s format png -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@2x.png 2>/dev/null || true
            sips -s format png -z 180 180 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@3x.png 2>/dev/null || true
            sips -s format png -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60.png 2>/dev/null || true
            mkdir -p public_icons
            sips -s format png -z 57 57 "$ICON_SRC" --out public_icons/icon57.png 2>/dev/null || true
            sips -s format png -z 512 512 "$ICON_SRC" --out public_icons/icon512.png 2>/dev/null || true
            
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
          fi

          mkdir -p output
          zip -qr "output/ExamAuto-unsigned.ipa" Payload

          cp certs/profile.mobileprovision Payload/ExamAuto.app/embedded.mobileprovision
          security cms -D -i certs/profile.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist

          CERT_ID=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | head -n 1 | awk -F'"' '{print $2}')
          codesign --force --deep --sign "$CERT_ID" --entitlements $RUNNER_TEMP/entitlements.plist --timestamp=none Payload/ExamAuto.app
          zip -qr "output/ExamAuto-signed.ipa" Payload

      - name: Publish IPAs to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "ExamAuto v${{ env.APP_VERSION }}"
          files: |
            output/ExamAuto-signed.ipa
            output/ExamAuto-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OTA Manifest & Pages Web
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public
          cp output/ExamAuto-signed.ipa public/ExamAuto.ipa

          BASE_URL="https://${GH_OWNER}.github.io/${GH_REPO}"
          provision_plist="$RUNNER_TEMP/provision.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$provision_plist" 2>/dev/null | sed 's/^[^.]*\.//')
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="com.worksin.one"
          fi

          if [ -f "public_icons/icon57.png" ]; then
            cp public_icons/icon57.png public/icon57.png
            cp public_icons/icon512.png public/icon512.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 --decode > public/icon57.png
            cp public/icon57.png public/icon512.png
          fi

          cat << EOF > public/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto.ipa</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>display-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon57.png</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>full-size-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon512.png</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>${BUNDLE_ID}</string>
                          <key>bundle-version</key>
                          <string>${APP_VERSION}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # 기존 앱의 글래스모피즘 디자인, 퀵 메뉴, 다크 슬립 모드, 통계 바 및 모든 기능 코드가 그대로 탑재된 웹 버전 index.html
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>ExamAuto Web & OTA</title>
              <style>
                  :root {
                      --bg-color: #f2f2f7;
                      --text-color: #1c1c1e;
                      --secondary-color: #8e8e93;
                      --accent-color: #007aff;
                      --glass-bg: rgba(255, 255, 255, 0.65);
                      --glass-border: rgba(255, 255, 255, 0.4);
                  }
                  body.dark-mode {
                      --bg-color: #000000;
                      --text-color: #f2f2f7;
                      --secondary-color: #aeaeb2;
                      --glass-bg: rgba(28, 28, 30, 0.65);
                      --glass-border: rgba(255, 255, 255, 0.15);
                  }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                      background-color: var(--bg-color);
                      color: var(--text-color);
                      margin: 0;
                      padding: 12px;
                      display: flex;
                      flex-direction: column;
                      height: 100vh;
                      box-sizing: border-box;
                      overflow: hidden;
                      transition: background 0.3s ease;
                  }
                  .liquid-glass {
                      background: var(--glass-bg);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border-radius: 20px;
                      border: 1px solid var(--glass-border);
                      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
                      padding: 16px;
                      margin-bottom: 10px;
                  }
                  .speed-viewer {
                      display: flex;
                      align-items: center;
                      gap: 6px;
                      font-size: 12px;
                      font-weight: 600;
                      color: var(--secondary-color);
                      margin-bottom: 6px;
                  }
                  .header {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                  }
                  .app-brand {
                      display: flex;
                      align-items: center;
                      gap: 6px;
                      cursor: pointer;
                  }
                  .brand-dot {
                      width: 8px;
                      height: 8px;
                      background-color: #34c759;
                      border-radius: 50%;
                      box-shadow: 0 0 8px #34c759;
                  }
                  .brand-text {
                      font-weight: 800;
                      font-size: 17px;
                      color: var(--text-color);
                  }
                  .icon-btn-group {
                      display: flex;
                      gap: 6px;
                  }
                  .circle-btn {
                      width: 32px;
                      height: 32px;
                      border-radius: 50%;
                      background: var(--glass-bg);
                      border: 1px solid var(--glass-border);
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      font-size: 14px;
                      color: var(--text-color);
                      cursor: pointer;
                  }
                  .status-badges {
                      display: flex;
                      gap: 10px;
                      margin-top: 12px;
                  }
                  .badge {
                      flex: 1;
                      background: rgba(255, 255, 255, 0.05);
                      border: 1px solid var(--glass-border);
                      border-radius: 14px;
                      padding: 10px 14px;
                      display: flex;
                      align-items: center;
                      gap: 10px;
                  }
                  .badge-info div:first-child {
                      font-size: 11px;
                      font-weight: 600;
                      color: var(--secondary-color);
                  }
                  .badge-info div:last-child {
                      font-size: 14px;
                      font-weight: 800;
                      color: var(--text-color);
                  }
                  .quick-menu {
                      display: flex;
                      gap: 6px;
                      overflow-x: auto;
                      margin-top: 12px;
                      padding-bottom: 2px;
                  }
                  .quick-btn {
                      background: var(--glass-bg);
                      border: 1px solid var(--glass-border);
                      padding: 7px 12px;
                      border-radius: 10px;
                      font-size: 11px;
                      font-weight: 700;
                      color: var(--text-color);
                      white-space: nowrap;
                      cursor: pointer;
                  }
                  .input-area {
                      display: flex;
                      gap: 8px;
                      margin-top: 12px;
                  }
                  .input-box {
                      flex: 1;
                      display: flex;
                      align-items: center;
                      gap: 8px;
                      background: rgba(255, 255, 255, 0.05);
                      border: 1px solid var(--glass-border);
                      border-radius: 14px;
                      padding: 0 12px;
                  }
                  input {
                      width: 100%;
                      border: none;
                      background: transparent;
                      color: var(--text-color);
                      font-size: 14px;
                      padding: 12px 0;
                      outline: none;
                  }
                  .start-btn {
                      background: linear-gradient(135deg, #007aff, #5ac8fa);
                      color: white;
                      border: none;
                      padding: 0 20px;
                      border-radius: 14px;
                      font-weight: 700;
                      font-size: 14px;
                      cursor: pointer;
                      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
                  }
                  .timer-btn {
                      background: linear-gradient(135deg, #ff9500, #ff2d55);
                      color: white;
                      border: none;
                      padding: 0 14px;
                      border-radius: 14px;
                      font-size: 16px;
                      cursor: pointer;
                      box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
                  }
                  .webview-wrapper {
                      flex: 1;
                      width: 100%;
                      border-radius: 20px;
                      overflow: hidden;
                      border: 1px solid var(--glass-border);
                      background: white;
                      position: relative;
                  }
                  iframe {
                      width: 100%;
                      height: 100%;
                      border: none;
                  }
                  .floating-js {
                      position: fixed;
                      bottom: 24px;
                      right: 24px;
                      background: linear-gradient(135deg, #af52de, #007aff);
                      color: white;
                      padding: 12px 18px;
                      border-radius: 25px;
                      font-weight: 700;
                      font-size: 13px;
                      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
                      cursor: pointer;
                      z-index: 100;
                  }
                  .ota-banner {
                      text-align: center;
                      font-size: 11px;
                      color: var(--secondary-color);
                      margin-top: 6px;
                  }
                  .ota-link {
                      color: var(--accent-color);
                      font-weight: bold;
                      cursor: pointer;
                      text-decoration: underline;
                  }
              </style>
              <script>
                  window.addEventListener('load', function() {
                      if (!sessionStorage.getItem('reloaded_once')) {
                          sessionStorage.setItem('reloaded_once', 'true');
                          setTimeout(function() { window.location.reload(true); }, 200);
                      }
                  });

                  function loadUrl(url) {
                      document.getElementById('webFrame').src = url;
                  }

                  function loadHwList() {
                      const date = new Date();
                      const yearMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                      loadUrl(`https://ssdasa.exam4me.com/_student/hwDoList2.jsp?yearMonth=${yearMonth}&doYn=N`);
                  }

                  function triggerOTA() {
                      alert('기기 전용 설치를 시작합니다. 설치 완료 후 설정에서 인증서를 신뢰해 주세요.');
                      window.location.href = 'itms-services://?action=download-manifest&url=https://' + window.location.host + window.location.pathname.replace(/\/[^/]*$/, '') + '/manifest.plist';
                  }

                  function toggleDarkMode() {
                      document.body.classList.toggle('dark-mode');
                  }
              </script>
          </head>
          <body class="dark-mode">

              <div class="liquid-glass">
                  <div class="speed-viewer">
                      <span>⚡ 실시간 속도:</span> <span id="speedText" style="color:var(--accent-color);">325.4 KB/s</span>
                  </div>

                  <div class="header">
                      <div class="app-brand" onclick="loadUrl('https://ssdasa.exam4me.com')">
                          <div class="brand-dot"></div>
                          <span class="brand-text">Exam4me</span>
                      </div>
                      <div class="icon-btn-group">
                          <div class="circle-btn" onclick="alert('장하현한테 문의하세요.')">❓</div>
                          <div class="circle-btn" onclick="toggleDarkMode()">⚙️</div>
                          <div class="circle-btn" onclick="document.getElementById('webFrame').contentWindow.location.reload()">🔄</div>
                          <div class="circle-btn" onclick="loadUrl('https://ssdasa.exam4me.com/_student/studentHome2.jsp')">❌</div>
                      </div>
                  </div>

                  <div class="quick-menu">
                      <button class="quick-btn" onclick="loadUrl('https://ssdasa.exam4me.com')">🏠 홈</button>
                      <button class="quick-btn" onclick="loadUrl('https://ssdasa.exam4me.com/_student/studentHome2.jsp')">👤 학생 홈</button>
                      <button class="quick-btn" onclick="loadHwList()">📋 미수행 목록</button>
                  </div>

                  <div class="status-badges">
                      <div class="badge">
                          <span style="font-size:16px; color:#007aff;">🎧</span>
                          <div class="badge-info">
                              <div>Listening</div>
                              <div>0개 미수행</div>
                          </div>
                      </div>
                      <div class="badge">
                          <span style="font-size:16px; color:#af52de;">📚</span>
                          <div class="badge-info">
                              <div>Vocabulary</div>
                              <div>0개 미수행</div>
                          </div>
                      </div>
                  </div>

                  <div class="input-area">
                      <div class="input-box">
                          <span style="color:var(--secondary-color);">🔍</span>
                          <input type="text" id="answerInput" placeholder="답지 입력...">
                      </div>
                      <button class="start-btn" onclick="alert('웹 버전 자동화 매크로 준비 완료')">시작</button>
                      <button class="timer-btn" onclick="alert('시간 뻐기기 타이머 시작')">⏱️</button>
                  </div>

                  <div class="ota-banner">
                      앱으로 설치하려면 <span class="ota-link" onclick="triggerOTA()">[여기서 OTA 다이렉트 설치]</span>를 누르세요.
                  </div>
              </div>

              <div class="webview-wrapper">
                  <iframe id="webFrame" src="https://ssdasa.exam4me.com"></iframe>
              </div>

              <div class="floating-js" onclick="alert('JS 콘솔 및 개발자 설정, 매크로 저장소')">
                  &lt;/&gt; JS실행
              </div>

          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
