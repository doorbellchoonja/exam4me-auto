name: Build ExamAuto IPA & Deploy OTA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Xcode 버전 선택
        run: sudo xcode-select -switch /Applications/Xcode_16.0.app

      - name: 직접 업로드된 인증서 파일 설치
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "actions_pass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "actions_pass" $KEYCHAIN_PATH

          # 1. p12 파일에서 인증서와 개인키 분리 추출 후 키체인에 등록
          openssl pkcs12 -in Certificates/cert.p12 -clcerts -nokeys -passin pass:"1" -out $RUNNER_TEMP/cert.cer
          openssl pkcs12 -in Certificates/cert.p12 -nocerts -nodes -passin pass:"1" -out $RUNNER_TEMP/key.pem

          security import $RUNNER_TEMP/cert.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security import $RUNNER_TEMP/key.pem -k $KEYCHAIN_PATH -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple: -s -k "actions_pass" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          rm -f $RUNNER_TEMP/cert.cer $RUNNER_TEMP/key.pem

          # 2. 모바일 프로비저닝 프로필 설치
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp Certificates/cert.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/2a94d76b-fdf3-4426-abf8-ca8bbb9ba331.mobileprovision

      - name: 표준 Xcode 프로젝트 생성 및 IPA 아카이브/빌드
        run: |
          # 1. xcodegen 설치
          brew install xcodegen

          # 2. project.yml 생성 (표준 Xcode 프로젝트 정의)
          cat << 'EOF' > project.yml
          name: ExamAuto
          options:
            bundleIdPrefix: com.SFn27a
            deploymentTarget:
              iOS: "15.0"
          targets:
            ExamAuto:
              type: application
              platform: iOS
              sources: [AppSource]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.SFn27a.5NDvCv
                  INFOPLIST_FILE: AppSource/Info.plist
                  CODE_SIGN_STYLE: Manual
                  CODE_SIGN_IDENTITY: "iPhone Distribution: Qingdao Rural Commercial Bank Co., Ltd"
                  PROVISIONING_PROFILE_SPECIFIER: "2a94d76b-fdf3-4426-abf8-ca8bbb9ba331"
                  DEVELOPMENT_TEAM: N3WP93Z7CM
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

          # 3. Xcode 프로젝트 파일 생성
          xcodegen generate

          # 4. xcodebuild 아카이브 빌드
          xcodebuild clean archive \
            -project ExamAuto.xcodeproj \
            -scheme ExamAuto \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ExamAuto.xcarchive

          # 5. Enterprise ExportOptions.plist 생성 및 IPA 추출
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>enterprise</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>N3WP93Z7CM</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.SFn27a.5NDvCv</key>
                  <string>2a94d76b-fdf3-4426-abf8-ca8bbb9ba331</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $PWD/build/ExamAuto.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/output

      - name: OTA Manifest & 웹페이지 생성
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public
          cp output/ExamAuto.ipa public/ExamAuto.ipa

          BASE_URL="https://${GH_OWNER}.github.io/${GH_REPO}"

          cat << EOF > public/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto.ipa</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.SFn27a.5NDvCv</string>
                          <key>bundle-version</key>
                          <string>1.0.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          cat << EOF > public/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ExamAuto OTA 설치</title>
              <style>
                  body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f2f2f7; }
                  .card { background: white; padding: 30px; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
                  .btn { display: inline-block; background-color: #007aff; color: white; padding: 14px 28px; text-decoration: none; border-radius: 12px; font-size: 17px; font-weight: 600; margin-top: 20px; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>ExamAuto 앱 설치</h2>
                  <p>Safari에서 아래 버튼을 클릭하여 다이렉트로 설치하세요.</p>
                  <a class="btn" href="itms-services://?action=download-manifest&url=${BASE_URL}/manifest.plist">설치하기</a>
              </div>
          </body>
          </html>
          EOF

      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
