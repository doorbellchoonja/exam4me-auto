name: Build Signed & Unsigned IPA, Deploy OTA & Web

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Dynamic Version
        id: versioning
        run: |
          BASE_VERSION="1.0"
          BUILD_NUMBER=${{ github.run_number }}
          FULL_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "APP_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Setup Keychain and Extract Certificates
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "actions" "$KEYCHAIN_PATH" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH" || true
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH" || true
          security list-keychain -d user -s "$KEYCHAIN_PATH" || true

          # 옵션 1 및 2 인증서 임포트 (비밀번호 "1")
          import_cert_1_2() {
            local dir=$1
            if [ -f "$dir/cert.p12" ]; then
              echo "Processing certificate in $dir..."
              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/cert.pem -legacy 2>/dev/null || \
              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/cert.pem || true

              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/key.pem -legacy 2>/dev/null || \
              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/key.pem || true

              if [ -f "$RUNNER_TEMP/cert.pem" ] && [ -f "$RUNNER_TEMP/key.pem" ]; then
                cat $RUNNER_TEMP/cert.pem $RUNNER_TEMP/key.pem > $RUNNER_TEMP/combined.pem
                openssl pkcs12 -export -in $RUNNER_TEMP/combined.pem -out $RUNNER_TEMP/rebuilt.p12 -passout pass:actions
                security import $RUNNER_TEMP/rebuilt.p12 -P actions -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
              fi
            fi
          }

          # 옵션 3 인증서 임포트 (비밀번호 "AppleP12.com")
          import_cert_3() {
            local dir="certs_3"
            if [ -f "$dir/cert.p12" ]; then
              echo "Processing certificate in $dir (HSBC)..."
              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"@ashtemobile" -clcerts -nokeys -out $RUNNER_TEMP/cert.pem -legacy 2>/dev/null || \
              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"@ashtemobile" -clcerts -nokeys -out $RUNNER_TEMP/cert.pem || true

              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"@ashtemobile" -nocerts -nodes -out $RUNNER_TEMP/key.pem -legacy 2>/dev/null || \
              openssl pkcs12 -in "$dir/cert.p12" -passin pass:"@ashtemobile" -nocerts -nodes -out $RUNNER_TEMP/key.pem || true

              if [ -f "$RUNNER_TEMP/cert.pem" ] && [ -f "$RUNNER_TEMP/key.pem" ]; then
                cat $RUNNER_TEMP/cert.pem $RUNNER_TEMP/key.pem > $RUNNER_TEMP/combined.pem
                openssl pkcs12 -export -in $RUNNER_TEMP/combined.pem -out $RUNNER_TEMP/rebuilt.p12 -passout pass:actions
                security import $RUNNER_TEMP/rebuilt.p12 -P actions -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
              fi
            fi
          }

          import_cert_1_2 "certs_1"
          import_cert_1_2 "certs_2"
          import_cert_3

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH" || true

      - name: Build Secure iOS Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SWIFT_SRC=$(find . -maxdepth 3 -name "App.swift" -o -name "main.swift" | head -n 1)
          if [ -z "$SWIFT_SRC" ]; then
            SWIFT_SRC=$(find . -maxdepth 3 -name "*.swift" | head -n 1)
          fi

          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI \
                 -framework WebKit \
                 -framework UIKit \
                 -O \
                 -whole-module-optimization \
                 -parse-as-library \
                 "$SWIFT_SRC" \
                 -o ExamAuto

          strip -r -u ExamAuto

      - name: Package Unsigned and Signed IPAs (Options 1, 2 & 3)
        run: |
          mkdir -p Payload/ExamAuto.app
          cp ExamAuto Payload/ExamAuto.app/ExamAuto
          echo -n "APPL????" > Payload/ExamAuto.app/PkgInfo

          PLIST_SRC=$(find . -maxdepth 3 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST_SRC" ]; then
            cp "$PLIST_SRC" Payload/ExamAuto.app/Info.plist
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ExamAuto" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string ExamAuto" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" Payload/ExamAuto.app/Info.plist 2>/dev/null || true

          ICON_SRC=$(find . -maxdepth 3 -name "*Icon*.png" -o -name "image*.png" | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            sips -s format png -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@2x.png 2>/dev/null || true
            sips -s format png -z 180 180 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@3x.png 2>/dev/null || true
            sips -s format png -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60.png 2>/dev/null || true
            mkdir -p public_icons
            sips -s format png -z 57 57 "$ICON_SRC" --out public_icons/icon57.png 2>/dev/null || true
            sips -s format png -z 512 512 "$ICON_SRC" --out public_icons/icon512.png 2>/dev/null || true
            
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
          fi

          mkdir -p output
          zip -qr "output/ExamAuto-unsigned.ipa" Payload
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          sign_ipa() {
            local opt_num=$1
            local prov_path=$2
            local output_name=$3

            if [ -f "$prov_path" ]; then
              cp "$prov_path" Payload/ExamAuto.app/embedded.mobileprovision
              security cms -D -i "$prov_path" > $RUNNER_TEMP/provision_$opt_num.plist 2>/dev/null || true
              if [ -f "$RUNNER_TEMP/provision_$opt_num.plist" ]; then
                /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/provision_$opt_num.plist > $RUNNER_TEMP/entitlements_$opt_num.plist 2>/dev/null || true
              fi
              
              CERT_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | head -n 1 | awk -F'"' '{print $2}')
              if [ -n "$CERT_ID" ] && [ -f "$RUNNER_TEMP/entitlements_$opt_num.plist" ]; then
                codesign --force --deep --sign "$CERT_ID" --entitlements $RUNNER_TEMP/entitlements_$opt_num.plist --timestamp=none Payload/ExamAuto.app || true
                zip -qr "output/$output_name" Payload
              else
                cp output/ExamAuto-unsigned.ipa "output/$output_name"
              fi
            else
              cp output/ExamAuto-unsigned.ipa "output/$output_name"
            fi
          }

          sign_ipa "1" "certs_1/profile.mobileprovision" "ExamAuto-signed-opt1.ipa"
          sign_ipa "2" "certs_2/profile.mobileprovision" "ExamAuto-signed-opt2.ipa"
          sign_ipa "3" "certs_3/profile.mobileprovision" "ExamAuto-signed-opt3.ipa"

      - name: Publish IPAs to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "ExamAuto v${{ env.APP_VERSION }}"
          files: |
            output/ExamAuto-signed-opt1.ipa
            output/ExamAuto-signed-opt2.ipa
            output/ExamAuto-signed-opt3.ipa
            output/ExamAuto-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OTA Manifests & Portal Page
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public
          cp output/ExamAuto-signed-opt1.ipa public/ExamAuto-opt1.ipa
          cp output/ExamAuto-signed-opt2.ipa public/ExamAuto-opt2.ipa
          cp output/ExamAuto-signed-opt3.ipa public/ExamAuto-opt3.ipa

          BASE_URL="https://${GH_OWNER}.github.io/${GH_REPO}"
          
          provision_plist="$RUNNER_TEMP/provision_3.plist"
          if [ ! -f "$provision_plist" ]; then
            provision_plist="$RUNNER_TEMP/provision_1.plist"
          fi
          
          BUNDLE_ID=""
          if [ -f "$provision_plist" ]; then
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$provision_plist" 2>/dev/null | sed 's/^[^.]*\.//')
          fi
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="com.worksin.one"
          fi

          if [ -f "public_icons/icon57.png" ]; then
            cp public_icons/icon57.png public/icon57.png
            cp public_icons/icon512.png public/icon512.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 --decode > public/icon57.png
            cp public/icon57.png public/icon512.png
          fi

          for opt in 1 2 3; do
            cat << EOF > public/manifest-opt${opt}.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto-opt${opt}.ipa</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>display-image</string>
                              <key>url</key>
                              <string>${BASE_URL}/icon57.png</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>full-size-image</string>
                              <key>url</key>
                              <string>${BASE_URL}/icon512.png</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>${BUNDLE_ID}</string>
                          <key>bundle-version</key>
                          <string>${APP_VERSION}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto (설치옵션 ${opt})</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF
          done

          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>ExamAuto OTA 설치 포털</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                      background-color: #000000;
                      color: #f2f2f7;
                      margin: 0;
                      padding: 20px;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      height: 100vh;
                      box-sizing: border-box;
                  }
                  .card {
                      background: rgba(28, 28, 30, 0.75);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border-radius: 20px;
                      border: 1px solid rgba(255, 255, 255, 0.15);
                      padding: 24px;
                      width: 100%;
                      max-width: 360px;
                      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                      text-align: center;
                  }
                  h1 { font-size: 20px; margin-bottom: 8px; }
                  p { font-size: 13px; color: #aeaeb2; margin-bottom: 24px; }
                  .btn {
                      display: block;
                      width: 100%;
                      padding: 14px 0;
                      border-radius: 14px;
                      font-weight: bold;
                      font-size: 15px;
                      text-decoration: none;
                      margin-bottom: 12px;
                      box-sizing: border-box;
                  }
                  .btn-opt1 { background-color: #007aff; color: white; }
                  .btn-opt2 { background-color: #5856d6; color: white; }
                  .btn-opt3 { background-color: #34c759; color: white; }
              </style>
              <script>
                  function installOpt(opt) {
                      const manifestName = 'manifest-opt' + opt + '.plist';
                      const url = 'itms-services://?action=download-manifest&url=' + encodeURIComponent('https://' + window.location.host + window.location.pathname.replace(/\/[^/]*$/, '') + '/' + manifestName);
                      window.location.href = url;
                  }
              </script>
          </head>
          <body>
              <div class="card">
                  <h1>ExamAuto OTA 설치</h1>
                  <p>원하시는 인증서 설치 옵션을 선택해 주세요.</p>
                  <a class="btn btn-opt1" href="#" onclick="installOpt(1)">설치 옵션 1 (기존 인증서)</a>
                  <a class="btn btn-opt2" href="#" onclick="installOpt(2)">설치 옵션 2 (신규 인증서)</a>
                  <a class="btn btn-opt3" href="#" onclick="installOpt(3)">설치 옵션 3 (신규 HSBC 인증서)</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
