name: Build Signed & Unsigned IPA, Deploy OTA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Dynamic Version
        id: versioning
        run: |
          BASE_VERSION="1.0"
          BUILD_NUMBER=${{ github.run_number }}
          FULL_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "APP_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Extract Certificate and Key
        run: |
          mkdir -p $RUNNER_TEMP/certs_out

          # 저장소 내 p12 및 mobileprovision 파일 자동 탐색
          P12_SRC=$(find . -maxdepth 3 -name "*.p12" | head -n 1)
          PROV_SRC=$(find . -maxdepth 3 -name "*.mobileprovision" | head -n 1)

          if [ -z "$P12_SRC" ] || [ -z "$PROV_SRC" ]; then
            echo "::error::인증서(.p12) 또는 프로비저닝 프로필(.mobileprovision) 파일을 찾을 수 없습니다."
            exit 1
          fi

          echo "Found P12: $P12_SRC"
          echo "Found Provisioning Profile: $PROV_SRC"

          mkdir -p certs
          cp "$P12_SRC" certs/cert.p12
          cp "$PROV_SRC" certs/profile.mobileprovision

          # 비밀번호 1로 인증서 및 키 추출
          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/cert.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/cert.pem

          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/key.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/key.pem

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"

          cat $RUNNER_TEMP/cert.pem $RUNNER_TEMP/key.pem > $RUNNER_TEMP/combined.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/combined.pem -out $RUNNER_TEMP/rebuilt.p12 -passout pass:actions
          
          security import $RUNNER_TEMP/rebuilt.p12 -P actions -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Secure Obfuscated iOS Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          SWIFT_SRC=$(find . -maxdepth 3 -name "App.swift" -o -name "main.swift" | head -n 1)
          if [ -z "$SWIFT_SRC" ]; then
            SWIFT_SRC=$(find . -maxdepth 3 -name "*.swift" | head -n 1)
          fi
          echo "Found Swift source: $SWIFT_SRC"

          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI \
                 -framework WebKit \
                 -framework UIKit \
                 -O \
                 -whole-module-optimization \
                 -parse-as-library \
                 "$SWIFT_SRC" \
                 -o ExamAuto

          strip -r -u ExamAuto

      - name: Package Unsigned and Signed IPA
        run: |
          # 1. 공통 앱 번들 생성
          mkdir -p Payload/ExamAuto.app
          cp ExamAuto Payload/ExamAuto.app/ExamAuto
          
          PLIST_SRC=$(find . -maxdepth 3 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST_SRC" ]; then
            cp "$PLIST_SRC" Payload/ExamAuto.app/Info.plist
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Payload/ExamAuto.app/Info.plist 2>/dev/null || true

          ICON_SRC=$(find . -maxdepth 3 -name "*Icon*.png" | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            sips -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@2x.png 2>/dev/null || true
            sips -z 180 180 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@3x.png 2>/dev/null || true
            sips -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60.png 2>/dev/null || true
          fi

          # 2. 서명되지 않은 Unsigned IPA 패키징 (TrollStore / Sideloadly / 개인인증서 서명용)
          mkdir -p output
          zip -qr "output/ExamAuto-unsigned.ipa" Payload

          # 3. 기업용 프로파일 주입 및 Codesign 서명 진행
          cp certs/profile.mobileprovision Payload/ExamAuto.app/embedded.mobileprovision

          security cms -D -i certs/profile.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist

          CERT_ID=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | head -n 1 | awk -F'"' '{print $2}')
          echo "Signing with: $CERT_ID"

          codesign --force --deep --sign "$CERT_ID" --entitlements $RUNNER_TEMP/entitlements.plist --timestamp=none Payload/ExamAuto.app
          
          # 4. 서명 완료된 Signed IPA 패키징
          zip -qr "output/ExamAuto-signed.ipa" Payload

      - name: Publish IPAs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "ExamAuto v${{ env.APP_VERSION }}"
          files: |
            output/ExamAuto-signed.ipa
            output/ExamAuto-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OTA Manifest & Pages Web
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public
          cp output/ExamAuto-signed.ipa public/ExamAuto.ipa
          cp output/ExamAuto-unsigned.ipa public/ExamAuto-unsigned.ipa

          BASE_URL="https://${GH_OWNER}.github.io/${GH_REPO}"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $RUNNER_TEMP/provision.plist | sed 's/^[^.]*\.//')
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="com.worksin.one"
          fi

          # OTA 57px, 512px 필수 아이콘 생성
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 --decode > public/icon57.png
          cp public/icon57.png public/icon512.png

          cat << EOF > public/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto.ipa</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>display-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon57.png</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>full-size-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon512.png</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>${BUNDLE_ID}</string>
                          <key>bundle-version</key>
                          <string>${APP_VERSION}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          cat << EOF > public/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ExamAuto 다운로드 및 설치</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f2f2f7; }
                  .card { background: white; padding: 32px 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; width: 310px; }
                  h2 { margin: 0 0 6px 0; font-size: 22px; color: #1c1c1e; }
                  p { margin: 0 0 20px 0; color: #8e8e93; font-size: 13px; }
                  .btn { display: block; text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 600; padding: 14px 0; margin-bottom: 12px; transition: opacity 0.2s; }
                  .btn-primary { background-color: #007aff; color: white; box-shadow: 0 4px 10px rgba(0,122,255,0.25); }
                  .btn-secondary { background-color: #e5e5ea; color: #1c1c1e; }
                  .btn:active { opacity: 0.7; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>ExamAuto</h2>
                  <p>v${APP_VERSION} 빌드 설치</p>
                  <a class="btn btn-primary" href="itms-services://?action=download-manifest&url=${BASE_URL}/manifest.plist">OTA 다이렉트 설치</a>
                  <a class="btn btn-secondary" href="${BASE_URL}/ExamAuto.ipa" download>서명된 IPA 다운로드</a>
                  <a class="btn btn-secondary" href="${BASE_URL}/ExamAuto-unsigned.ipa" download>순수 Unsigned IPA 다운로드</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
