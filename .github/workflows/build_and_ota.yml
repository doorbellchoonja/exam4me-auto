name: Build ExamAuto IPA & Deploy OTA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 직접 업로드된 인증서 파일 설치
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "actions_pass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "actions_pass" $KEYCHAIN_PATH

          # 1. p12 파일에서 인증서와 키 추출 및 키체인 등록
          openssl pkcs12 -in Certificates/cert.p12 -clcerts -nokeys -passin pass:"1" -out $RUNNER_TEMP/cert.cer
          openssl pkcs12 -in Certificates/cert.p12 -nocerts -nodes -passin pass:"1" -out $RUNNER_TEMP/key.pem

          security import $RUNNER_TEMP/cert.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security import $RUNNER_TEMP/key.pem -k $KEYCHAIN_PATH -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple: -s -k "actions_pass" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          rm -f $RUNNER_TEMP/cert.cer $RUNNER_TEMP/key.pem

          # 2. 모바일 프로비저닝 프로필 설치
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp Certificates/cert.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/b6faffb9-be71-4711-b11a-d5e79b38537a.mobileprovision

      - name: 정식 Xcode 아카이브 빌드 및 IPA 추출
        run: |
          # 1. 표준 Xcode 프로젝트 구조 생성
          mkdir -p ExamAuto.xcodeproj
          cat << 'EOF' > ExamAuto.xcodeproj/project.pbxproj
          // !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {
            };
            objectVersion = 54;
            objects = {
              100000000000000000000001 /* App.swift in Sources */ = {isa = PBXBuildFile; fileRef = 200000000000000000000001 /* App.swift */; };
              200000000000000000000001 /* App.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App.swift; sourceTree = "<group>"; };
              200000000000000000000002 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
              300000000000000000000001 /* ExamAuto.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = ExamAuto.app; sourceTree = BUILT_PRODUCTS_DIR; };
              400000000000000000000001 /* AppSource */ = {
                isa = PBXGroup;
                children = (
                  200000000000000000000001 /* App.swift */,
                  200000000000000000000002 /* Info.plist */,
                );
                name = AppSource;
                path = AppSource;
                sourceTree = "<group>";
              };
              400000000000000000000002 /* MainGroup */ = {
                isa = PBXGroup;
                children = (
                  400000000000000000000001 /* AppSource */,
                  300000000000000000000001 /* ExamAuto.app */,
                );
                sourceTree = "<group>";
              };
              500000000000000000000001 /* Sources */ = {
                isa = PBXSourcesBuildPhase;
                buildActionMask = 2147483647;
                files = (
                  100000000000000000000001 /* App.swift in Sources */,
                );
                runOnlyForDeploymentPostprocessing = 0;
              };
              600000000000000000000001 /* ExamAuto */ = {
                isa = PBXNativeTarget;
                buildConfigurationList = 700000000000000000000001 /* Build configuration list for PBXNativeTarget "ExamAuto" */;
                buildPhases = (
                  500000000000000000000001 /* Sources */,
                );
                buildRules = (
                );
                dependencies = (
                );
                name = ExamAuto;
                productName = ExamAuto;
                productReference = 300000000000000000000001 /* ExamAuto.app */;
                productType = "com.apple.product-type.application";
              };
              700000000000000000000001 /* Build configuration list for PBXNativeTarget "ExamAuto" */ = {
                isa = XCConfigurationList;
                buildConfigurations = (
                  800000000000000000000001 /* Release */,
                );
                defaultConfigurationIsVisible = 0;
                defaultConfigurationName = Release;
              };
              700000000000000000000002 /* Build configuration list for PBXProject "ExamAuto" */ = {
                isa = XCConfigurationList;
                buildConfigurations = (
                  800000000000000000000002 /* Release */,
                );
                defaultConfigurationIsVisible = 0;
                defaultConfigurationName = Release;
              };
              800000000000000000000001 /* Release */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
                  CODE_SIGN_IDENTITY = "iPhone Distribution: Jiangsu Simcere Pharmaceutical Co.,Ltd";
                  CODE_SIGN_STYLE = Manual;
                  DEVELOPMENT_TEAM = VD7465CKUB;
                  INFOPLIST_FILE = AppSource/Info.plist;
                  IPHONEOS_DEPLOYMENT_TARGET = 15.0;
                  LD_RUNPATH_SEARCH_PATHS = (
                    "$(inherited)",
                    "@executable_path/Frameworks",
                  );
                  PRODUCT_BUNDLE_IDENTIFIER = com.worksin.one;
                  PRODUCT_NAME = "$(TARGET_NAME)";
                  PROVISIONING_PROFILE_SPECIFIER = "b6faffb9-be71-4711-b11a-d5e79b38537a";
                  SWIFT_VERSION = 5.0;
                  TARGETED_DEVICE_FAMILY = "1,2";
                };
                name = Release;
              };
              800000000000000000000002 /* Release */ = {
                isa = XCBuildConfiguration;
                buildSettings = {
                  ALWAYS_SEARCH_USER_PATHS = NO;
                  CLANG_ENABLE_OBJC_ARC = YES;
                  COPY_PHASE_STRIP = NO;
                  SDKROOT = iphoneos;
                };
                name = Release;
              };
              900000000000000000000001 /* Project object */ = {
                isa = PBXProject;
                attributes = {
                  BuildIndependentTargetsInParallel = 1;
                  LastUpgradeCheck = 1500;
                  TargetAttributes = {
                    600000000000000000000001 = {
                      CreatedOnToolsVersion = 15.0;
                      ProvisioningStyle = Manual;
                    };
                  };
                };
                buildConfigurationList = 700000000000000000000002 /* Build configuration list for PBXProject "ExamAuto" */;
                compatibilityVersion = "Xcode 14.0";
                developmentRegion = en;
                hasScannedForEncodings = 0;
                knownRegions = (
                  en,
                  Base,
                );
                mainGroup = 400000000000000000000002 /* MainGroup */;
                productRefGroup = 400000000000000000000002 /* MainGroup */;
                projectDirPath = "";
                projectRoot = "";
                targets = (
                  600000000000000000000001 /* ExamAuto */,
                );
              };
            };
            rootObject = 900000000000000000000001 /* Project object */;
          }
          EOF

          # 2. 정규 Scheme 생성 (Clean/Build/Archive 액션 포함)
          mkdir -p ExamAuto.xcodeproj/xcshareddata/xcschemes
          cat << 'EOF' > ExamAuto.xcodeproj/xcshareddata/xcschemes/ExamAuto.xcscheme
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1500"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "600000000000000000000001"
                         BuildableName = "ExamAuto.app"
                         BlueprintName = "ExamAuto"
                         ReferencedContainer = "container:ExamAuto.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction
                buildConfiguration = "Release"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES">
                <Testables>
                </Testables>
             </TestAction>
             <LaunchAction
                buildConfiguration = "Release"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "600000000000000000000001"
                      BuildableName = "ExamAuto.app"
                      BlueprintName = "ExamAuto"
                      ReferencedContainer = "container:ExamAuto.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "600000000000000000000001"
                      BuildableName = "ExamAuto.app"
                      BlueprintName = "ExamAuto"
                      ReferencedContainer = "container:ExamAuto.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration = "Release">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          EOF

          # 3. xcodebuild 아카이브 실행
          xcodebuild archive \
            -project ExamAuto.xcodeproj \
            -scheme ExamAuto \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ExamAuto.xcarchive

          # 4. Enterprise ExportOptions.plist 생성 및 IPA 추출
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>enterprise</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>VD7465CKUB</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.worksin.one</key>
                  <string>b6faffb9-be71-4711-b11a-d5e79b38537a</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $PWD/build/ExamAuto.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/output

      - name: OTA Manifest & 웹페이지 생성
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public
          cp output/*.ipa public/ExamAuto.ipa

          BASE_URL="https://${GH_OWNER}.github.io/${GH_REPO}"

          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 --decode > public/icon57.png
          cp public/icon57.png public/icon512.png

          cat << EOF > public/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto.ipa</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>display-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon57.png</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>full-size-image</string>
                              <key>needs-shine</key>
                              <false/>
                              <key>url</key>
                              <string>${BASE_URL}/icon512.png</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.worksin.one</string>
                          <key>bundle-version</key>
                          <string>1.0.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          cat << EOF > public/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ExamAuto OTA 설치</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f2f2f7; }
                  .card { background: white; padding: 32px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; max-width: 85%; width: 320px; }
                  .btn { display: block; background-color: #007aff; color: white; padding: 15px 0; text-decoration: none; border-radius: 14px; font-size: 17px; font-weight: 600; margin-top: 24px; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2 style="margin:0 0 8px 0; color:#1c1c1e;">ExamAuto</h2>
                  <p style="margin:0; color:#8e8e93; font-size:14px;">Safari에서 아래 버튼을 눌러 설치하세요.</p>
                  <a class="btn" href="itms-services://?action=download-manifest&url=${BASE_URL}/manifest.plist">설치하기</a>
              </div>
          </body>
          </html>
          EOF

      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
