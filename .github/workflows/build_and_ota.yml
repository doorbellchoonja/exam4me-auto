name: Build Signed & Unsigned IPA, Deploy OTA & Web

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Dynamic Version
        id: versioning
        run: |
          BASE_VERSION="1.0"
          BUILD_NUMBER=${{ github.run_number }}
          FULL_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "APP_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Extract Certificate and Key (Option 1 & Option 2 Support)
        run: |
          mkdir -p $RUNNER_TEMP/certs_out_1 $RUNNER_TEMP/certs_out_2
          
          # 설치옵션 1: 기존 인증서 (저장소 내 기본 p12 & mobileprovision)
          P12_1=$(find . -maxdepth 3 -name "*.p12" | head -n 1)
          PROV_1=$(find . -maxdepth 3 -name "*.mobileprovision" | head -n 1)

          if [ -n "$P12_1" ] && [ -n "$PROV_1" ]; then
            mkdir -p certs_1
            cp "$P12_1" certs_1/cert.p12
            cp "$PROV_1" certs_1/profile.mobileprovision

            openssl pkcs12 -in certs_1/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/certs_out_1/cert.pem -legacy 2>/dev/null || \
            openssl pkcs12 -in certs_1/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/certs_out_1/cert.pem

            openssl pkcs12 -in certs_1/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/certs_out_1/key.pem -legacy 2>/dev/null || \
            openssl pkcs12 -in certs_1/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/certs_out_1/key.pem
          fi

          # 설치옵션 2: 새로 올린 인증서 (사용자 제공 파일 세트)
          # 만약 추가 세트가 별도 폴더에 없다면 옵션 1과 동일 폴더 구조 혹은 업로드된 명칭 분기 처리
          mkdir -p certs_2
          if [ -f "cert.p12" ] && [ -f "cert.mobileprovision" ]; then
            cp cert.p12 certs_2/cert.p12
            cp cert.mobileprovision certs_2/profile.mobileprovision
          elif [ -n "$P12_1" ]; then
            cp "$P12_1" certs_2/cert.p12
            cp "$PROV_1" certs_2/profile.mobileprovision
          fi

          openssl pkcs12 -in certs_2/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/certs_out_2/cert.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs_2/cert.p12 -passin pass:"1" -clcerts -nokeys -out $RUNNER_TEMP/certs_out_2/cert.pem

          openssl pkcs12 -in certs_2/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/certs_out_2/key.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs_2/cert.p12 -passin pass:"1" -nocerts -nodes -out $RUNNER_TEMP/certs_out_2/key.pem

          # 기본 키체인 설정 (설치옵션 2 인증서 기준 메인 서명 수행)
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"

          cat $RUNNER_TEMP/certs_out_2/cert.pem $RUNNER_TEMP/certs_out_2/key.pem > $RUNNER_TEMP/certs_out_2/combined.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/certs_out_2/combined.pem -out $RUNNER_TEMP/certs_out_2/rebuilt.p12 -passout pass:actions
          
          security import $RUNNER_TEMP/certs_out_2/rebuilt.p12 -P actions -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Secure iOS Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SWIFT_SRC=$(find . -maxdepth 3 -name "App.swift" -o -name "main.swift" | head -n 1)
          if [ -z "$SWIFT_SRC" ]; then
            SWIFT_SRC=$(find . -maxdepth 3 -name "*.swift" | head -n 1)
          fi

          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI \
                 -framework WebKit \
                 -framework UIKit \
                 -O \
                 -whole-module-optimization \
                 -parse-as-library \
                 "$SWIFT_SRC" \
                 -o ExamAuto

          strip -r -u ExamAuto

      - name: Package Unsigned and Signed IPAs (Option 1 & Option 2)
        run: |
          mkdir -p Payload/ExamAuto.app
          cp ExamAuto Payload/ExamAuto.app/ExamAuto
          echo -n "APPL????" > Payload/ExamAuto.app/PkgInfo

          PLIST_SRC=$(find . -maxdepth 3 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST_SRC" ]; then
            cp "$PLIST_SRC" Payload/ExamAuto.app/Info.plist
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ExamAuto" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string ExamAuto" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Payload/ExamAuto.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" Payload/ExamAuto.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" Payload/ExamAuto.app/Info.plist 2>/dev/null || true

          ICON_SRC=$(find . -maxdepth 3 -name "*Icon*.png" -o -name "image*.png" | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            sips -s format png -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@2x.png 2>/dev/null || true
            sips -s format png -z 180 180 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60@3x.png 2>/dev/null || true
            sips -s format png -z 120 120 "$ICON_SRC" --out Payload/ExamAuto.app/AppIcon60x60.png 2>/dev/null || true
            mkdir -p public_icons
            sips -s format png -z 57 57 "$ICON_SRC" --out public_icons/icon57.png 2>/dev/null || true
            sips -s format png -z 512 512 "$ICON_SRC" --out public_icons/icon512.png 2>/dev/null || true
            
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" Payload/ExamAuto.app/Info.plist 2>/dev/null || true
          fi

          mkdir -p output

          # 1. 미서명 IPA 패키징
          zip -qr "output/ExamAuto-unsigned.ipa" Payload

          # 2. 설치옵션 1 서명 (기존 인증서 세트 사용)
          if [ -f "certs_1/profile.mobileprovision" ]; then
            cp certs_1/profile.mobileprovision Payload/ExamAuto.app/embedded.mobileprovision
            security cms -D -i certs_1/profile.mobileprovision > $RUNNER_TEMP/provision_1.plist
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/provision_1.plist > $RUNNER_TEMP/entitlements_1.plist
            CERT_ID_1=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | head -n 1 | awk -F'"' '{print $2}')
            codesign --force --deep --sign "$CERT_ID_1" --entitlements $RUNNER_TEMP/entitlements_1.plist --timestamp=none Payload/ExamAuto.app
            zip -qr "output/ExamAuto-signed-opt1.ipa" Payload
          else
            cp output/ExamAuto-unsigned.ipa output/ExamAuto-signed-opt1.ipa
          fi

          # 3. 설치옵션 2 서명 (새로 올린 인증서 세트 사용)
          cp certs_2/profile.mobileprovision Payload/ExamAuto.app/embedded.mobileprovision
          security cms -D -i certs_2/profile.mobileprovision > $RUNNER_TEMP/provision_2.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/provision_2.plist > $RUNNER_TEMP/entitlements_2.plist
          CERT_ID_2=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | head -n 1 | awk -F'"' '{print $2}')
          codesign --force --deep --sign "$CERT_ID_2" --entitlements $RUNNER_TEMP/entitlements_2.plist --timestamp=none Payload/ExamAuto.app
          zip -qr "output/ExamAuto-signed-opt2.ipa" Payload

      - name: Publish IPAs to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "ExamAuto v${{ env.APP_VERSION }}"
          files: |
            output/ExamAuto-signed-opt1.ipa
            output/ExamAuto-signed-opt2.ipa
            output/ExamAuto-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OTA Manifests & Portal Page
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public
          cp output/ExamAuto-signed-opt1.ipa public/ExamAuto-opt1.ipa
          cp output/ExamAuto-signed-opt2.ipa public/ExamAuto-opt2.ipa

          BASE_URL="https://${GH_OWNER}.github.io/${GH_REPO}"
          
          # Bundle ID 추출 (옵션 2 기준)
          provision_plist="$RUNNER_TEMP/provision_2.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$provision_plist" 2>/dev/null | sed 's/^[^.]*\.//')
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="com.worksin.one"
          fi

          if [ -f "public_icons/icon57.png" ]; then
            cp public_icons/icon57.png public/icon57.png
            cp public_icons/icon512.png public/icon512.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 --decode > public/icon57.png
            cp public/icon57.png public/icon512.png
          fi

          # 옵션 1 매니페스트 생성
          cat << EOF > public/manifest-opt1.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto-opt1.ipa</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>display-image</string>
                              <key>url</key>
                              <string>${BASE_URL}/icon57.png</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>full-size-image</string>
                              <key>url</key>
                              <string>${BASE_URL}/icon512.png</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>${BUNDLE_ID}</string>
                          <key>bundle-version</key>
                          <string>${APP_VERSION}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto (설치옵션 1)</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # 옵션 2 매니페스트 생성
          cat << EOF > public/manifest-opt2.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${BASE_URL}/ExamAuto-opt2.ipa</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>display-image</string>
                              <key>url</key>
                              <string>${BASE_URL}/icon57.png</string>
                          </dict>
                          <dict>
                              <key>kind</key>
                              <string>full-size-image</string>
                              <key>url</key>
                              <string>${BASE_URL}/icon512.png</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>${BUNDLE_ID}</string>
                          <key>bundle-version</key>
                          <string>${APP_VERSION}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>ExamAuto (설치옵션 2)</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # 설치 옵션 1과 옵션 2를 선택할 수 있는 포털 페이지 생성
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>ExamAuto OTA 설치 포털</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                      background-color: #000000;
                      color: #f2f2f7;
                      margin: 0;
                      padding: 20px;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      height: 100vh;
                      box-sizing: border-box;
                  }
                  .card {
                      background: rgba(28, 28, 30, 0.75);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border-radius: 20px;
                      border: 1px solid rgba(255, 255, 255, 0.15);
                      padding: 24px;
                      width: 100%;
                      max-width: 360px;
                      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                      text-align: center;
                  }
                  h1 { font-size: 20px; margin-bottom: 8px; }
                  p { font-size: 13px; color: #aeaeb2; margin-bottom: 24px; }
                  .btn {
                      display: block;
                      width: 100%;
                      padding: 14px 0;
                      border-radius: 14px;
                      font-weight: bold;
                      font-size: 15px;
                      text-decoration: none;
                      margin-bottom: 12px;
                      box-sizing: border-box;
                  }
                  .btn-opt1 { background-color: #007aff; color: white; }
                  .btn-opt2 { background-color: #34c759; color: white; }
              </style>
              <script>
                  function installOpt(opt) {
                      const manifestName = opt === 1 ? 'manifest-opt1.plist' : 'manifest-opt2.plist';
                      const url = 'itms-services://?action=download-manifest&url=' + encodeURIComponent('https://' + window.location.host + window.location.pathname.replace(/\/[^/]*$/, '') + '/' + manifestName);
                      window.location.href = url;
                  }
              </script>
          </head>
          <body>
              <div class="card">
                  <h1>ExamAuto OTA 설치</h1>
                  <p>원하시는 인증서 설치 옵션을 선택해 주세요.</p>
                  <a class="btn btn-opt1" href="#" onclick="installOpt(1)">설치 옵션 1 (기존 인증서)</a>
                  <a class="btn btn-opt2" href="#" onclick="installOpt(2)">설치 옵션 2 (신규 업로드 인증서)</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
